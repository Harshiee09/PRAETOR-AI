# Alias -> statute registry IDs (spec: docs/topics/legal/statute-status.md, "Aliases").
# The FIRST id is the Act the alias literally names: exact section lookup uses only that one, because section
# numbers do not carry over between an old code and its successor (s. 438 CrPC is not s. 438 BNSS). The rest are
# added for search expansion, so a question about a repealed Act also retrieves its successor.
# Matching is case-insensitive on word boundaries; full titles and short titles come from statutes.yaml.

- {alias: CrPC, expands_to: [crpc-1973, bnss-2023]}
- {alias: Cr.P.C., expands_to: [crpc-1973, bnss-2023]}
- {alias: Criminal Procedure Code, expands_to: [crpc-1973, bnss-2023]}
- {alias: Code of Criminal Procedure, expands_to: [crpc-1973, bnss-2023]}
- {alias: BNSS, expands_to: [bnss-2023, crpc-1973]}
- {alias: Bharatiya Nagarik Suraksha Sanhita, expands_to: [bnss-2023, crpc-1973]}
- {alias: Bharatiya Nyaya Sanhita, expands_to: [bns-2023, ipc-1860]}
