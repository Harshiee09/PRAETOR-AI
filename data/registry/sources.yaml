sc-judgments:
  name: Indian Supreme Court Judgments (AWS Open Data)
  bucket: indian-supreme-court-judgments
  region: ap-south-1
  registry_page: https://registry.opendata.aws/indian-supreme-court-judgments/
  authority: Supreme Court of India
  jurisdiction: IN
  licence: CC-BY-4.0
  attribution: >-
    Indian Supreme Court Judgments, accessed {date} from registry.opendata.aws/indian-supreme-court-judgments
  # metadata/parquet/year=YYYY/metadata.parquet; PDFs at data/pdf/year=YYYY/english/<name>_EN.pdf (verified 2026-09-23)
  metadata_prefix: metadata/parquet
  pdf_prefix: data/pdf
