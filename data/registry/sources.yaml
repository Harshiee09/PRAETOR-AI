  api_url: https://indiacode.gov.in/server/api
  authority: Parliament of India
  jurisdiction: IN
  licence: >-
    Government of India legislative text published on India Code. Reproduction of Acts is governed by
    Copyright Act 1957 s. 52(1)(q); the migrated site's terms of use were not located on 2026-09-23 (CHECK).
  acts:
