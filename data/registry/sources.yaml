      item_uuid: 1930ffdb-10f3-4d71-bc42-f91303dae14e
      handle: 123456789/496068
      domain_tags: [property_land, registration]
      phase: 1
    - id: tpa-1882
      title: The Transfer of Property Act, 1882
      act_id: AC_CEN_3_20_00042_188204_1523272233671
      item_uuid: 2b436b95-ae89-4c5f-ab70-3d5ef5ffd8e8
      handle: 123456789/496421
