# Lay or alternative legal terms -> the wording the statutes themselves use (retrieval-pipeline note, step 3 "Rewrite").
#
# Search expansion only. A matched entry adds its `statutory` wording to keyword search, to a second dense query and to
# the reranker's query. It never adds a section or an Act, never maps a section number, and is never shown to users or
# cited: answers still cite only retrieved text.
#
# Every entry records where the equivalence is attested. Hindi terms (`terms_hi`) without an official source are marked
# `verified: {hi: false}` and are listed in docs/STATUS.md "Needs you" for a Hindi speaker.
# Added 2026-09-24 (DECISIONS D36) after tracing the failures in D35; the entries were chosen after seeing those
# failures, so gold-set gains that depend on them are a regression check, not an unbiased estimate.

- id: anticipatory-bail
  terms: [anticipatory bail, pre-arrest bail]
  terms_hi: [अग्रिम जमानत]
  statutory: [bail to person apprehending arrest, reason to believe that he may be arrested]
  evidence:
    - "BNSS s. 482 heading: 'Direction for grant of bail to person apprehending arrest' (India Code, handle 123456789/496550)"
    - "Nathu Singh v. State of U.P., SC 2021-05-28, para 17 quotes CrPC s. 438 under the same heading in an anticipatory-bail case (chunk b0a421bb30d4:para-17:02f647b3)"
    - "Dhanraj Aswani v. Amar S. Mulchandani, [2024] 9 S.C.R. 257, para 7 calls s. 438 CrPC 'pre-arrest bail' (chunk fad3381b8be4:para-7-part-2-of-3:92e7f45b)"
  hindi_evidence: "secondary sources only (hindi.nyaaya.org/legal-explainer/anticipatory-bail/, hindi.livelaw.in), checked 2026-09-24; no official glossary found"
  verified: {en: true, hi: false}

- id: home-buyer
