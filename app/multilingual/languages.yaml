# Language registry (spec: docs/topics/data/multilingual.md). Per-language behaviour lives here, not in code.
# tesseract: traineddata code from `tesseract --list-langs` on the dev machine. Tesseract is NOT installed yet
#            (DECISIONS D9), so every value is null until it is and the list is checked.
# lid:       whether the chosen statistical language-ID model supports the language. No LID model chosen yet
#            (Phase 1 relies on the source's declared language plus Unicode script detection), so null.
# translation: engine used for query/answer translation, if any. None yet.

